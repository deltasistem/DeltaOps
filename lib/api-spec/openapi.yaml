openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for SGMA (Sistema de Gestión de Mantenimiento y Activos)
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard indicators and charts
  - name: assets
    description: Asset (activos) management
  - name: work-orders
    description: Work order (órdenes de trabajo) management
  - name: maintenance-plans
    description: Preventive maintenance plans
  - name: spare-parts
    description: Spare parts inventory
  - name: locations
    description: Locations (ubicaciones)
  - name: work-centers
    description: Work centers (centros de trabajo)
  - name: technicians
    description: Personnel (técnicos)
  - name: suppliers
    description: Suppliers (proveedores)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Indicadores generales
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/asset-status:
    get:
      operationId: getAssetStatusBreakdown
      tags: [dashboard]
      summary: Estado de equipos
      responses:
        "200":
          description: Asset status breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusCount"

  /dashboard/work-orders-by-type:
    get:
      operationId: getWorkOrdersByType
      tags: [dashboard]
      summary: OT por tipo de mantenimiento
      responses:
        "200":
          description: Work orders grouped by type
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusCount"

  /dashboard/costs-by-month:
    get:
      operationId: getCostsByMonth
      tags: [dashboard]
      summary: Costos de mantenimiento por mes
      responses:
        "200":
          description: Monthly maintenance costs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyCost"

  /dashboard/costs-by-asset:
    get:
      operationId: getCostsByAsset
      tags: [dashboard]
      summary: Costos por activo
      responses:
        "200":
          description: Costs grouped by asset
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetCost"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Actividad reciente
      responses:
        "200":
          description: Recent activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: Listar activos
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            type: string
        - name: tipo
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
    post:
      operationId: createAsset
      tags: [assets]
      summary: Crear activo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"

  /assets/{id}:
    get:
      operationId: getAsset
      tags: [assets]
      summary: Obtener activo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateAsset
      tags: [assets]
      summary: Actualizar activo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
    delete:
      operationId: deleteAsset
      tags: [assets]
      summary: Eliminar activo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /assets/{id}/history:
    get:
      operationId: getAssetHistory
      tags: [assets]
      summary: Hoja de vida del equipo (historial de OT)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Asset work order history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkOrder"

  /work-orders:
    get:
      operationId: listWorkOrders
      tags: [work-orders]
      summary: Listar órdenes de trabajo
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            type: string
        - name: tipo
          in: query
          required: false
          schema:
            type: string
        - name: prioridad
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of work orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkOrder"
    post:
      operationId: createWorkOrder
      tags: [work-orders]
      summary: Crear orden de trabajo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkOrderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrder"

  /work-orders/{id}:
    get:
      operationId: getWorkOrder
      tags: [work-orders]
      summary: Obtener orden de trabajo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Work order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrder"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateWorkOrder
      tags: [work-orders]
      summary: Actualizar orden de trabajo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkOrderUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkOrder"
    delete:
      operationId: deleteWorkOrder
      tags: [work-orders]
      summary: Eliminar orden de trabajo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /maintenance-plans:
    get:
      operationId: listMaintenancePlans
      tags: [maintenance-plans]
      summary: Listar planes de mantenimiento preventivo
      responses:
        "200":
          description: List of maintenance plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaintenancePlan"
    post:
      operationId: createMaintenancePlan
      tags: [maintenance-plans]
      summary: Crear plan de mantenimiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenancePlanInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenancePlan"

  /maintenance-plans/{id}:
    patch:
      operationId: updateMaintenancePlan
      tags: [maintenance-plans]
      summary: Actualizar plan de mantenimiento
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenancePlanUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenancePlan"
    delete:
      operationId: deleteMaintenancePlan
      tags: [maintenance-plans]
      summary: Eliminar plan de mantenimiento
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /spare-parts:
    get:
      operationId: listSpareParts
      tags: [spare-parts]
      summary: Listar repuestos
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: lowStock
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of spare parts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SparePart"
    post:
      operationId: createSparePart
      tags: [spare-parts]
      summary: Crear repuesto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SparePartInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SparePart"

  /spare-parts/{id}:
    patch:
      operationId: updateSparePart
      tags: [spare-parts]
      summary: Actualizar repuesto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SparePartUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SparePart"
    delete:
      operationId: deleteSparePart
      tags: [spare-parts]
      summary: Eliminar repuesto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /spare-parts/{id}/movements:
    post:
      operationId: createStockMovement
      tags: [spare-parts]
      summary: Registrar movimiento de inventario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockMovementInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SparePart"

  /locations:
    get:
      operationId: listLocations
      tags: [locations]
      summary: Listar ubicaciones
      responses:
        "200":
          description: List of locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
    post:
      operationId: createLocation
      tags: [locations]
      summary: Crear ubicación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"

  /locations/{id}:
    patch:
      operationId: updateLocation
      tags: [locations]
      summary: Actualizar ubicación
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
    delete:
      operationId: deleteLocation
      tags: [locations]
      summary: Eliminar ubicación
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /work-centers:
    get:
      operationId: listWorkCenters
      tags: [work-centers]
      summary: Listar centros de trabajo
      responses:
        "200":
          description: List of work centers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkCenter"
    post:
      operationId: createWorkCenter
      tags: [work-centers]
      summary: Crear centro de trabajo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkCenterInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkCenter"

  /work-centers/{id}:
    patch:
      operationId: updateWorkCenter
      tags: [work-centers]
      summary: Actualizar centro de trabajo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkCenterUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkCenter"
    delete:
      operationId: deleteWorkCenter
      tags: [work-centers]
      summary: Eliminar centro de trabajo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /technicians:
    get:
      operationId: listTechnicians
      tags: [technicians]
      summary: Listar personal
      responses:
        "200":
          description: List of technicians
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Technician"
    post:
      operationId: createTechnician
      tags: [technicians]
      summary: Crear personal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TechnicianInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Technician"

  /technicians/{id}:
    patch:
      operationId: updateTechnician
      tags: [technicians]
      summary: Actualizar personal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TechnicianUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Technician"
    delete:
      operationId: deleteTechnician
      tags: [technicians]
      summary: Eliminar personal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      summary: Listar proveedores
      responses:
        "200":
          description: List of suppliers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"
    post:
      operationId: createSupplier
      tags: [suppliers]
      summary: Crear proveedor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"

  /suppliers/{id}:
    patch:
      operationId: updateSupplier
      tags: [suppliers]
      summary: Actualizar proveedor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
    delete:
      operationId: deleteSupplier
      tags: [suppliers]
      summary: Eliminar proveedor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    DashboardSummary:
      type: object
      required:
        - totalEquipos
        - equiposOperativos
        - equiposEnMantenimiento
        - equiposFueraServicio
        - otAbiertas
        - otVencidas
        - mantenimientosProgramados
        - mantenimientosEjecutados
        - disponibilidadMecanica
        - disponibilidadOperacional
        - mttr
        - mtbf
        - repuestosBajoStock
      properties:
        totalEquipos:
          type: integer
        equiposOperativos:
          type: integer
        equiposEnMantenimiento:
          type: integer
        equiposFueraServicio:
          type: integer
        otAbiertas:
          type: integer
        otVencidas:
          type: integer
        mantenimientosProgramados:
          type: integer
        mantenimientosEjecutados:
          type: integer
        disponibilidadMecanica:
          type: number
        disponibilidadOperacional:
          type: number
        mttr:
          type: number
        mtbf:
          type: number
        repuestosBajoStock:
          type: integer

    StatusCount:
      type: object
      required:
        - label
        - value
      properties:
        label:
          type: string
        value:
          type: integer

    MonthlyCost:
      type: object
      required:
        - mes
        - costo
      properties:
        mes:
          type: string
        costo:
          type: number

    AssetCost:
      type: object
      required:
        - equipo
        - costo
      properties:
        equipo:
          type: string
        costo:
          type: number

    ActivityItem:
      type: object
      required:
        - id
        - tipo
        - descripcion
        - fecha
      properties:
        id:
          type: integer
        tipo:
          type: string
        descripcion:
          type: string
        fecha:
          type: string

    Asset:
      type: object
      required:
        - id
        - codigo
        - nombre
        - tipo
        - estado
      properties:
        id:
          type: integer
        codigo:
          type: string
        nombre:
          type: string
        tipo:
          type: string
        marca:
          type: ["string", "null"]
        modelo:
          type: ["string", "null"]
        serie:
          type: ["string", "null"]
        anio:
          type: ["integer", "null"]
        ubicacionId:
          type: ["integer", "null"]
        ubicacionNombre:
          type: ["string", "null"]
        centroTrabajoId:
          type: ["integer", "null"]
        centroTrabajoNombre:
          type: ["string", "null"]
        estado:
          type: string
        responsable:
          type: ["string", "null"]
        horometro:
          type: ["number", "null"]
        kilometraje:
          type: ["number", "null"]
        horasAcumuladas:
          type: ["number", "null"]
        vidaUtil:
          type: ["integer", "null"]
        imageUrl:
          type: ["string", "null"]
        notas:
          type: ["string", "null"]

    AssetInput:
      type: object
      required:
        - codigo
        - nombre
        - tipo
        - estado
      properties:
        codigo:
          type: string
          minLength: 1
        nombre:
          type: string
          minLength: 1
        tipo:
          type: string
        marca:
          type: string
        modelo:
          type: string
        serie:
          type: string
        anio:
          type: integer
        ubicacionId:
          type: integer
        centroTrabajoId:
          type: integer
        estado:
          type: string
        responsable:
          type: string
        horometro:
          type: number
        kilometraje:
          type: number
        horasAcumuladas:
          type: number
        vidaUtil:
          type: integer
        imageUrl:
          type: string
        notas:
          type: string

    AssetUpdate:
      type: object
      properties:
        codigo:
          type: string
          minLength: 1
        nombre:
          type: string
          minLength: 1
        tipo:
          type: string
        marca:
          type: string
        modelo:
          type: string
        serie:
          type: string
        anio:
          type: integer
        ubicacionId:
          type: integer
        centroTrabajoId:
          type: integer
        estado:
          type: string
        responsable:
          type: string
        horometro:
          type: number
        kilometraje:
          type: number
        horasAcumuladas:
          type: number
        vidaUtil:
          type: integer
        imageUrl:
          type: string
        notas:
          type: string

    WorkOrder:
      type: object
      required:
        - id
        - numero
        - equipoId
        - tipo
        - prioridad
        - estado
        - fechaCreacion
      properties:
        id:
          type: integer
        numero:
          type: string
        equipoId:
          type: integer
        equipoNombre:
          type: ["string", "null"]
        equipoCodigo:
          type: ["string", "null"]
        tipo:
          type: string
        prioridad:
          type: string
        estado:
          type: string
        tecnicoId:
          type: ["integer", "null"]
        tecnicoNombre:
          type: ["string", "null"]
        centroTrabajoId:
          type: ["integer", "null"]
        centroTrabajoNombre:
          type: ["string", "null"]
        descripcion:
          type: ["string", "null"]
        reporteFalla:
          type: ["string", "null"]
        diagnostico:
          type: ["string", "null"]
        causaRaiz:
          type: ["string", "null"]
        solucion:
          type: ["string", "null"]
        horasEstimadas:
          type: ["number", "null"]
        horasReales:
          type: ["number", "null"]
        costoManoObra:
          type: ["number", "null"]
        costoRepuestos:
          type: ["number", "null"]
        costoTotal:
          type: ["number", "null"]
        fechaCreacion:
          type: string
        fechaProgramada:
          type: ["string", "null"]
        fechaCierre:
          type: ["string", "null"]

    WorkOrderInput:
      type: object
      required:
        - equipoId
        - tipo
        - prioridad
        - estado
      properties:
        equipoId:
          type: integer
        tipo:
          type: string
        prioridad:
          type: string
        estado:
          type: string
