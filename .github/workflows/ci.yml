# DeltaOps · DGP-001 — Pipeline básico (calidad automática)
# Puertas mecánicas: instalación reproducible, typecheck completo del monorepo,
# formato y pruebas base. Ningún cambio se integra con la puerta en rojo.
name: deltaops-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Instalación reproducible
        run: pnpm install --frozen-lockfile
      - name: Typecheck (libs + artefactos)
        run: pnpm run typecheck
      - name: Formato
        run: pnpm exec prettier --check "artifacts/api-server/src/**/*.ts" "scripts/src/**/*.ts" "lib/db/src/**/*.ts"
      - name: Pruebas base
        run: pnpm --filter @workspace/api-server run test
      - name: Pruebas del Kernel
        run: pnpm --filter @workspace/kernel run test
      - name: Pruebas de la Plataforma
        run: pnpm --filter @workspace/platform run test
      - name: Pruebas del Módulo de Referencia
        run: pnpm --filter @workspace/module-reference run test
      - name: Pruebas del Módulo de Activos
        run: pnpm --filter @workspace/module-activos run test
      - name: Pruebas del Design System
        run: pnpm --filter @workspace/design-system run test
      - name: Pruebas del Business Foundation Framework
        run: pnpm --filter @workspace/business-foundation run test
      - name: Pruebas del Workflow Engine
        run: pnpm --filter @workspace/workflow-engine run test
      - name: Pruebas del Dynamic Forms Engine
        run: pnpm --filter @workspace/dynamic-forms run test
      - name: Pruebas del Módulo Órdenes de Trabajo
        run: pnpm --filter @workspace/module-ordenes run test
